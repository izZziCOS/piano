server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # File types come from nginx's built-in mime.types (included by nginx.conf),
    # so .mp3, .woff2 and the rest are all labelled correctly.

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The piano samples and the font never change: let browsers keep them.
    location ~* \.(mp3|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
}
