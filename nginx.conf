server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES modules must be served as JavaScript.
    types {
        text/html                html;
        text/css                 css;
        text/javascript          js mjs;
        image/svg+xml            svg;
        text/plain               txt;
    }
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/css text/javascript image/svg+xml;
}
