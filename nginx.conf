# How long browsers may keep each kind of file. (A map instead of add_header in
# separate locations: nginx drops the server's add_header lines in any location
# that has its own, which would lose the security headers below.)
map $uri $cache_control {
    # The service worker must be checked for updates on every visit.
    ~*/sw\.js$                       "no-cache";
    # The piano samples, the font and VexFlow (versioned file name) never change.
    ~*\.(mp3|woff2)$                 "public, max-age=31536000, immutable";
    ~*/vendor/                       "public, max-age=31536000, immutable";
    ~*\.(js|css|svg|png|webmanifest)$ "public, max-age=3600";
    # The page itself: always revalidate, so a new version shows up at once.
    default                          "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # File types come from nginx's built-in mime.types (included by nginx.conf),
    # so .mp3, .woff2 and the rest are all labelled correctly.

    add_header Cache-Control $cache_control;
    # The same policy as the <meta> tag in index.html (keep them in step; the
    # tests check), plus frame-ancestors, which only works as a header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-z4Y/mflN5LAfRn7pvlLoKXeM0TSyqiMznSobqMFLzAw='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "midi=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not in every nginx's mime.types; X-Content-Type-Options needs the right type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/manifest+json;
}
